<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>山海森之突袭</title>
<link rel="stylesheet" href="./assets/app.css">
</head>
<body>
<div id="app">
  <canvas id="view" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="boot">
    <div class="boot-mark">山海</div>
    <div class="boot-sub" id="boot-msg">正在进入山海秘境…</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
  </div>
  <div id="rotate-tip">建议横屏游玩，视野更开阔</div>
  <div id="unsupported">
    <div class="unsup-card">
      <b>当前环境无法启动 3D 画面</b>
      <p>本作需要浏览器支持 WebGL。请换用较新的 Chrome / Edge / Safari，或在 B站 App 内重新打开。</p>
      <button type="button" id="unsup-reload">重新加载</button>
    </div>
  </div>
  <div id="fatal"></div>
</div>
<script src="./assets/three.min.js"></script>
<script src="./assets/app.js"></script>
</body>
</html>
