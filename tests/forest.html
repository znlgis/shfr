<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forest · PG.world 自测</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe9ff;
    font-family: 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
  #view { display: block; width: 100vw; height: 100vh; outline: none; }
  #hud { position: fixed; left: 12px; top: 12px; padding: 10px 14px; border-radius: 12px;
    background: rgba(255,255,255,.88); color: #24313f; box-shadow: 0 6px 20px rgba(28,70,56,.18);
    font: 600 12.5px/1.55 ui-monospace, Consolas, monospace; pointer-events: none;
    white-space: pre; letter-spacing: .2px; }
  #err { position: fixed; left: 12px; right: 12px; bottom: 12px; max-height: 42%; overflow: auto;
    padding: 10px 14px; border-radius: 12px; background: rgba(232,69,60,.95); color: #fff;
    font: 600 12px/1.5 ui-monospace, Consolas, monospace; display: none; white-space: pre-wrap;
    z-index: 9; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
    background: linear-gradient(#bfe9ff, #e7f7dd); color: #24313f; font-weight: 900; font-size: 20px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">加载中…</div>
<div id="err"></div>
<div id="boot">正在生成森林…</div>

<script src="../vendor/three.min.js"></script>
<script src="../src/40-util.js"></script>
<script src="../src/20-world.js"></script>
<script>
(() => {
  'use strict';
  const errBox = document.getElementById('err');
  const hud = document.getElementById('hud');
  const errors = [];
  function showError(msg) {
    errors.push(String(msg));
    errBox.style.display = 'block';
    errBox.textContent = 'JS 错误 (' + errors.length + ')：\n' + errors.join('\n\n');
    document.title = 'ERROR x' + errors.length;
    hud.textContent = 'ERROR x' + errors.length + '\n' + errors[0].split('\n')[0];
  }
  window.onerror = function (msg, src, line, col, err) {
    showError((err && err.stack) || (msg + ' @ ' + src + ':' + line + ':' + col));
  };
  window.addEventListener('unhandledrejection', function (e) {
    showError('Promise: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
  });

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? parseFloat(q.get(k)) : d);
  const showHud = q.get('hud') !== '0';
  if (!showHud) hud.style.display = 'none';

  // ---------------- 渲染器 / 相机 ----------------
  const canvas = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(q.has('pr') ? parseFloat(q.get('pr')) : Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = q.get('shadow') !== '0';
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (THREE.SRGBColorSpace && 'outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  // 复现 lead 90-main 的渲染配置（?tone=aces&exp=1.12）
  if (q.get('tone') === 'aces' && THREE.ACESFilmicToneMapping !== undefined) {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = parseFloat(q.get('exp') || '1.12');
  }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(num('fov', 62), window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(num('x', 0), num('y', 1.7), num('z', 20));
  camera.lookAt(num('tx', 0), num('ty', 1.2), num('tz', 0));

  // 半球光营造明亮氛围；方向光由 world.build 负责（默认加，带阴影）
  const hemi = new THREE.HemisphereLight(0xdff2ff, 0x6fae4e, num('hemi', 1.35));
  scene.add(hemi);
  const LIGHTS = q.get('lights');
  if (LIGHTS === 'lead') {
    hemi.color.setHex(0xdff3ff); hemi.groundColor.setHex(0x6f9a3e); hemi.intensity = 1.35;
    scene.background = new THREE.Color(0xbde6ff);
    scene.fog = new THREE.Fog(0xcfeaff, 38, 132);
    const sun = new THREE.DirectionalLight(0xfff3d6, 2.35);
    sun.position.set(26, 34, 16);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 140;
    sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
    sun.shadow.camera.top = 55; sun.shadow.camera.bottom = -55;
    sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
    scene.add(sun); scene.add(sun.target);
    const rim = new THREE.DirectionalLight(0x9fd8ff, 0.55);
    rim.position.set(-22, 14, -26); scene.add(rim);
  }

  // ---------------- 构建世界 ----------------
  const t0 = performance.now();
  let world = null;
  try {
    world = PG.world.build(scene, THREE, { seed: num('seed', 20241111), skipLights: q.get('worldlights') === '0' });
  } catch (e) {
    showError('PG.world.build 失败：\n' + (e && e.stack || e));
  }
  const buildMs = performance.now() - t0;

  // 调试：替换草的材质，排查渲染问题
  const gra = q.get('gra');
  if (gra && world) {
    world.group.traverse((o) => {
      if (o.name !== 'grass') return;
      if (gra === 'plain') o.material = new THREE.MeshBasicMaterial({ color: 0x6fbf45, side: THREE.DoubleSide });
      else if (gra === 'vc') o.material = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
      else if (gra === 'ic') o.material = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
      else if (gra === 'vcnt') { const m = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }); m.toneMapped = false; o.material = m; }
      else if (gra === 'std') o.material = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 1 });
      else if (gra === 'lambert') o.material = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
      else if (gra === 'nowind') {
        const m = o.material.clone();
        m.onBeforeCompile = () => {};
        delete m.customProgramCacheKey;
        m.needsUpdate = true;
        o.material = m;
      }
    });
  }

  // 调试：按名字前缀隐藏 / 仅显示某些对象（?hide=grass,flowers / ?only=grass）
  const hideList = (q.get('hide') || '').split(',').filter(Boolean);
  const onlyList = (q.get('only') || '').split(',').filter(Boolean);
  if (world && (hideList.length || onlyList.length)) {
    const match = (name, list) => list.some((k) => name === k || name.indexOf(k) === 0);
    world.group.traverse((o) => {
      if (!o.name) return;
      if (onlyList.length) { if (!match(o.name, onlyList)) o.visible = false; }
      else if (match(o.name, hideList)) o.visible = false;
    });
    hud.textContent = 'HIDDEN ' + hideList.join(',') + ' ONLY ' + onlyList.join(',');
  }

  // ---------------- 契约字段自检 ----------------
  const REQUIRED = ['group', 'radius', 'update', 'groundY', 'colliders', 'spawnPoints', 'landmarks', 'sunDir', 'reset'];
  const apiLines = [];
  if (world) {
    let missing = [];
    REQUIRED.forEach((k) => { if (world[k] === undefined || world[k] === null) missing.push(k); });
    const gy = world.groundY ? world.groundY(12, -7) : NaN;
    const ok = (v) => (v ? '✓' : '✗');
    apiLines.push('API   ' + (missing.length ? '缺失: ' + missing.join(',') : '契约字段全部存在 ✓'));
    apiLines.push('group ' + ok(!!world.group) + '  radius ' + world.radius + '  groundY(12,-7)=' + gy.toFixed(2));
    apiLines.push('colliders ' + world.colliders.length + '  spawnPoints ' + world.spawnPoints.length +
      '  landmarks ' + world.landmarks.length);
    const dirOk = world.sunDir && Math.abs(world.sunDir.length() - 1) < 1e-3;
    apiLines.push('sunDir ' + ok(dirOk) + '  (' + world.sunDir.toArray().map((v) => v.toFixed(2)).join(', ') + ')');
    if (world.spawnPoints.length < 12) apiLines.push('✗ spawnPoints 少于 12 个');
    const badSpawn = world.spawnPoints.some((s) => {
      const r = Math.hypot(s.x, s.z);
      return r < 50 || r > 58;
    });
    apiLines.push('spawn 半径 50~58 ' + ok(!badSpawn));
  } else {
    apiLines.push('world = null');
  }

  // ---------------- QA 数据审计（?qa=1） ----------------
  if (q.get('qa') === '1' && world) {
    const QA = { colliders: {}, terrain: {}, spawn: {}, world: {} };
    // 1) colliders 是否覆盖所有近处树干
    const trees = world.trees || [];
    const near = trees.filter((t) => !t.outer && Math.hypot(t.x, t.z) < world.radius);
    const cols = world.colliders || [];
    let missing = [], maxGap = 0, sumGap = 0;
    for (const t of near) {
      let best = Infinity;
      for (const c of cols) {
        const d = Math.hypot(c.x - t.x, c.z - t.z);
        const gap = d - c.r; // 负值代表碰撞体覆盖树干中心
        if (gap < best) best = gap;
      }
      if (best > 0.02) missing.push({ x: +t.x.toFixed(1), z: +t.z.toFixed(1), gap: +best.toFixed(2) });
      maxGap = Math.max(maxGap, best);
      sumGap += best;
    }
    QA.colliders = {
      trunks: near.length, colliders: cols.length,
      missing: missing.slice(0, 8), missingCount: missing.length,
      maxGap: +maxGap.toFixed(3), avgGap: +(sumGap / Math.max(1, near.length)).toFixed(3),
    };
    // 2) groundY 与地形网格是否一致（对地形三角形做垂直射线）
    const terrain = world.group.getObjectByName('terrain');
    if (terrain) {
      const ray = new THREE.Raycaster();
      const down = new THREE.Vector3(0, -1, 0);
      let maxErr = 0, sumErr = 0, n = 0, bad = [];
      const pts = [];
      for (let i = 0; i < 48; i++) {
        const a = (i / 48) * Math.PI * 2;
        const rr = 2 + (i % 7) * 8.2;
        pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
      }
      pts.push([0, 14], [0, -14], [14, 0], [-14, 0], [-27, -19], [18.5, -21], [0, -36], [34, -31]);
      for (const p of pts) {
        const x = p[0], z = p[1];
        ray.set(new THREE.Vector3(x, 40, z), down);
        const hit = ray.intersectObject(terrain, false)[0];
        if (!hit) { bad.push({ x: +x.toFixed(1), z: +z.toFixed(1), err: 'noHit' }); continue; }
        const gy = world.groundY(x, z);
        const err = Math.abs(hit.point.y - gy);
        maxErr = Math.max(maxErr, err);
        sumErr += err;
        n++;
        if (err > 0.05) bad.push({ x: +x.toFixed(1), z: +z.toFixed(1), err: +err.toFixed(3) });
      }
      QA.terrain = {
        samples: n, maxErr: +maxErr.toFixed(4), avgErr: +(sumErr / Math.max(1, n)).toFixed(4),
        bad: bad.slice(0, 8), badCount: bad.length,
      };
    }
    // 3) spawn 环 50~58
    const sp = world.spawnPoints || [];
    QA.spawn = {
      count: sp.length,
      minR: +Math.min.apply(null, sp.map((s) => Math.hypot(s.x, s.z))).toFixed(2),
      maxR: +Math.max.apply(null, sp.map((s) => Math.hypot(s.x, s.z))).toFixed(2),
      minPairDist: (() => {
        let m = Infinity;
        for (let i = 0; i < sp.length; i++) for (let j = i + 1; j < sp.length; j++) {
          m = Math.min(m, Math.hypot(sp[i].x - sp[j].x, sp[i].z - sp[j].z));
        }
        return +m.toFixed(2);
      })(),
    };
    // 4) 场地 landmark / 地表高度范围
    QA.world = {
      radius: world.radius,
      colliderCount: cols.length,
      landmarks: world.landmarks.map((l) => l.type),
      groundYRange: (() => {
        let mn = Infinity, mx = -Infinity;
        for (let i = 0; i < 200; i++) {
          const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * 60;
          const y = world.groundY(Math.cos(a) * rr, Math.sin(a) * rr);
          mn = Math.min(mn, y); mx = Math.max(mx, y);
        }
        return [+mn.toFixed(2), +mx.toFixed(2)];
      })(),
    };
    window.__PG_QA__ = QA;
    document.title = 'QA ' + (QA.colliders.missingCount ? 'FAIL' : 'PASS');
    const qaBox = document.createElement('pre');
    qaBox.id = 'qa';
    qaBox.style.cssText = 'position:fixed;left:0;top:0;margin:0;font:11px monospace;background:#fff;color:#123;z-index:99;max-width:98vw;white-space:pre-wrap';
    qaBox.textContent = 'QASTART' + JSON.stringify(QA) + 'QAEND';
    document.body.appendChild(qaBox);
  }

  // ---------------- 主循环 ----------------
  const clock = new THREE.Clock();
  let elapsed = 0, frames = 0, fpsAcc = 0, fps = 0, worstFps = Infinity, firstFrame = true;
  let peakCalls = 0, peakTris = 0;

  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.1);
    elapsed += dt;
    try {
      if (world) world.update(dt, elapsed, camera);
      renderer.render(scene, camera);
    } catch (e) {
      showError('渲染循环异常：\n' + (e && e.stack || e));
      return;
    }
    if (firstFrame) {
      firstFrame = false;
      const boot = document.getElementById('boot');
      if (boot) boot.style.display = 'none';
      window.__PG_FOREST_READY__ = true;
    }
    frames++;
    fpsAcc += dt;
    if (fpsAcc >= 0.4) {
      const cur = frames / fpsAcc;
      fps = Math.round(cur);
      if (elapsed > 0.6 && cur < worstFps) worstFps = cur;
      frames = 0; fpsAcc = 0;
    }
    peakCalls = Math.max(peakCalls, renderer.info.render.calls);
    peakTris = Math.max(peakTris, renderer.info.render.triangles);

    if (showHud) {
      hud.textContent =
        'FPS ' + fps + '   (min ' + (worstFps === Infinity ? '-' : Math.round(worstFps)) + ')\n' +
        'draw ' + renderer.info.render.calls + ' / 150   tri ' + (renderer.info.render.triangles / 1000).toFixed(0) + 'k\n' +
        'build ' + buildMs.toFixed(0) + 'ms   size ' + window.innerWidth + 'x' + window.innerHeight + '\n' +
        apiLines.join('\n') + '\n' +
        'PG.errors ' + ((window.PG && PG.errors && PG.errors.length) || 0) + '   JS 错误 ' + errors.length;
    }
    window.__PG_STATS__ = {
      fps: fps,
      minFps: worstFps === Infinity ? null : Math.round(worstFps),
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      errors: errors.slice(),
      buildMs: buildMs,
      world: world ? { radius: world.radius, colliders: world.colliders.length, spawn: world.spawnPoints.length, landmarks: world.landmarks.length } : null,
    };
  }
  frame();

  // 窗口尺寸变化
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
